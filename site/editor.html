<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor | The Utah View</title>
<style>
:root{
  --red:#B53816; --rd:#902C11; --bk:#141414; --g7:#333; --g6:#555; --g5:#777; --g4:#9a9a9a;
  --g3:#c9c9c9; --g2:#e3e3e3; --g1:#f0f0f0; --g0:#f7f6f4; --w:#fff; --ok:#1e7e34; --okbg:#e6f4ea;
  --warn:#8a6d00; --warnbg:#fff6da;
  --s:'Helvetica Neue',Arial,sans-serif; --f:Georgia,'Times New Roman',serif;
  --sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.05); --rad:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--s);color:var(--bk);background:var(--g0);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--red)}

/* ---------- gate ---------- */
.gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;background:
  radial-gradient(1200px 500px at 50% -10%, rgba(181,56,22,.06), transparent)}
.gate-box{text-align:center;max-width:400px;width:100%;background:var(--w);border:1px solid var(--g2);
  border-radius:16px;padding:40px 28px;box-shadow:var(--sh)}
.gate-box img{width:64px;height:64px;display:block;margin:0 auto 14px}
.gate-title{font-size:22px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.gate-sub{font-size:14px;color:var(--g5);margin:6px 0 22px}
#gBtn{display:flex;justify-content:center;margin-bottom:10px;min-height:44px}
.gate-fallback{display:inline-flex;align-items:center;gap:10px;padding:11px 22px;font-size:14px;font-weight:600;
  color:var(--g7);background:var(--w);border:1px solid var(--g2);border-radius:8px}
.gate-note{display:block;margin-top:16px;font-size:12px;color:var(--g4)}
.gate-err{margin-top:16px;font-size:13px;color:var(--red);display:none}.gate-err.show{display:block}
.gate-home{display:inline-block;margin-top:20px;font-size:13px;color:var(--g4);text-decoration:none}

/* ---------- shell ---------- */
.shell{display:none;min-height:100dvh;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr}
.shell.on{display:grid}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;background:var(--w);
  border-bottom:1px solid var(--g2);position:sticky;top:0;z-index:30}
.hamburger{display:none;width:40px;height:40px;border:none;background:none;border-radius:8px;font-size:22px;color:var(--g6)}
.hamburger:hover{background:var(--g1)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bk)}
.brand img{width:30px;height:30px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.brand span{font-size:11px;font-weight:700;color:var(--g4);letter-spacing:1px;text-transform:uppercase;
  border-left:1px solid var(--g2);padding-left:10px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.viewsite{font-size:13px;color:var(--g5);text-decoration:none}.viewsite:hover{color:var(--red)}
.userchip{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border:1px solid var(--g2);border-radius:999px;background:var(--w);font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background-position:center}
.userchip .em{color:var(--g6);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout{border:none;background:none;color:var(--g5);font-size:13px;font-weight:600;padding:4px 6px;border-radius:6px}
.signout:hover{color:var(--red);background:var(--g1)}

.side{grid-row:2;background:var(--w);border-right:1px solid var(--g2);padding:14px 10px;overflow-y:auto}
.side-hd{padding:10px 12px 4px;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--g4)}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;margin:2px 0;border:none;
  background:none;border-radius:10px;font-size:14px;font-weight:600;color:var(--g6)}
.nav:hover{background:var(--g1);color:var(--bk)}
.nav.on{background:var(--red);color:#fff}
.nav .ic{width:18px;text-align:center;font-size:15px}
.side-foot{margin-top:12px;padding:12px;font-size:11px;color:var(--g4);border-top:1px solid var(--g1);word-break:break-all}
.scrim{display:none}

.main{grid-row:2;overflow-y:auto;padding:22px}
.wrap{max-width:960px;margin:0 auto}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:.3px}
.page-head .sp{flex:1}

/* ---------- cards / bits ---------- */
.card{background:var(--w);border:1px solid var(--g2);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px;letter-spacing:.3px}
.card .desc{font-size:13px;color:var(--g5);margin-bottom:12px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--w);border:1px solid var(--g2);border-radius:var(--rad);padding:16px 18px;box-shadow:var(--sh)}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--g5);margin-top:4px}
.stat .l.red{color:var(--red)}
.quick{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.qbtn{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--g2);border-radius:var(--rad);
  background:var(--w);text-align:left;box-shadow:var(--sh)}
.qbtn:hover{border-color:var(--red)}
.qbtn .qic{width:40px;height:40px;border-radius:10px;background:#fbe9e3;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.qbtn b{display:block;font-size:14px}.qbtn small{color:var(--g5);font-size:12px}

.bt{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;font-size:14px;font-weight:600;border-radius:9px;border:1px solid transparent}
.bp{background:var(--red);color:#fff}.bp:hover{background:var(--rd)}
.bs{background:var(--w);color:var(--g7);border-color:var(--g2)}.bs:hover{border-color:var(--g4)}
.bd{background:var(--w);color:var(--red);border-color:var(--g2)}.bd:hover{background:var(--red);color:#fff;border-color:var(--red)}
.bsm{padding:6px 11px;font-size:13px}
.btn-ghost{background:none;border:none;color:var(--g5);padding:6px;border-radius:7px;font-size:15px}.btn-ghost:hover{background:var(--g1);color:var(--bk)}
.btn-ghost:disabled{opacity:.3;cursor:default}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.searchbox{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--w);border:1px solid var(--g2);border-radius:10px;padding:0 12px}
.searchbox input{flex:1;border:none;outline:none;padding:10px 0;background:none}
.segment{display:inline-flex;background:var(--g1);border-radius:9px;padding:3px}
.segment button{border:none;background:none;padding:7px 13px;font-size:13px;font-weight:600;color:var(--g6);border-radius:7px}
.segment button.on{background:var(--w);color:var(--bk);box-shadow:var(--sh)}

.list{background:var(--w);border:1px solid var(--g2);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--g1)}
.row:last-child{border-bottom:none}.row:hover{background:var(--g0)}
.row .meta{flex:1;min-width:0}
.row .ti{font-size:15px;font-weight:700;color:var(--bk);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.row .ti:hover{color:var(--red)}
.row .su{font-size:12.5px;color:var(--g5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .acts{display:flex;gap:4px;flex-shrink:0;align-items:center}
/* Phones: the headline gets its own full line; badge and actions sit under it. */
@media(max-width:600px){
  .row{flex-wrap:wrap;row-gap:6px}
  .row .meta{order:1;flex:1 1 calc(100% - 60px)}
  .row .ti{white-space:normal;overflow:visible}
  .row .badge{order:2;margin-left:58px}
  .row .acts{order:3;margin-left:auto}
}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.badge.live{background:var(--okbg);color:var(--ok)}
.nav .badge{background:var(--red);color:#fff;margin-left:auto;padding:1px 7px}
.badge.draft{background:var(--warnbg);color:var(--warn)}
.empty{padding:38px 18px;text-align:center;color:var(--g4);font-size:14px}

.fl{margin-bottom:14px}
.fl label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--g6);margin-bottom:6px}
.fl input,.fl select,.fl textarea{width:100%;padding:11px 12px;border:1px solid var(--g2);border-radius:9px;outline:none;background:var(--w)}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(181,56,22,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--g5);margin-top:5px}

.rtb{display:flex;gap:3px;flex-wrap:wrap;padding:7px 8px;border:1px solid var(--g2);border-bottom:none;border-radius:9px 9px 0 0;background:var(--g0)}
.rb{padding:5px 10px;font-size:13px;background:var(--w);border:1px solid var(--g2);border-radius:6px;color:var(--g7)}.rb:hover{background:var(--g1)}
.re{min-height:240px;max-height:460px;overflow-y:auto;padding:14px 16px;border:1px solid var(--g2);border-radius:0 0 9px 9px;
  font-family:var(--f);font-size:17px;line-height:1.7;color:var(--g7);outline:none}
.re:focus{border-color:var(--red)}.re p{margin-bottom:12px}.re h3{font-size:21px;font-weight:700;margin:18px 0 8px;color:var(--bk)}
.re img{max-width:100%;border-radius:6px;margin:12px 0;display:block}.re blockquote{border-left:3px solid var(--red);padding-left:14px;color:var(--g5);font-style:italic}
.re figure,.pvb figure{margin:12px 0}.re figure img,.pvb figure img{margin:0 0 4px}
.re figcaption,.pvb figcaption{font-family:var(--s);font-size:12.5px;color:var(--g5);line-height:1.4}

.pv{margin-top:16px;border:1px solid var(--g2);border-radius:var(--rad);overflow:hidden}
.pvh{padding:8px 14px;background:var(--g0);border-bottom:1px solid var(--g2);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--g5)}
.pvb{padding:22px 20px;font-family:var(--f)}
.pvb .pr{font-family:var(--s);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.pvb .pt{font-size:26px;font-weight:700;line-height:1.15;margin-bottom:8px}
.pvb .ps{font-size:16px;color:var(--g5);margin-bottom:10px}
.pvb .pm{font-family:var(--s);font-size:12px;color:var(--g4);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--g2)}
.pvb .pc{font-size:16px;line-height:1.7;color:var(--g7)}
.pvb .pc img{max-width:100%;border-radius:6px;margin:10px 0}

.secrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--g1);flex-wrap:wrap}
.secrow:last-child{border-bottom:none}
.secrow .ord{display:flex;gap:3px}
.secrow strong{min-width:140px;font-size:13.5px}
.secrow input[type=text]{flex:1;min-width:140px;padding:8px 10px;font-size:13px;border:1px solid var(--g2);border-radius:7px}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--g3);border-radius:999px;transition:.15s}
.slider:before{content:"";position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+.slider{background:var(--red)}.switch input:checked+.slider:before{transform:translateX(17px)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--bk);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* An error stays until it's closed or replaced, so it can't be missed. */
.toast.err{background:#7a1d0c;pointer-events:auto;padding-right:44px}
.toast .tx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:#fff;font-size:20px;line-height:1;padding:4px 8px;opacity:.8}
.toast .tx:hover{opacity:1}
.toast .undo{margin-left:14px;border:none;background:none;color:#ffb4a1;font-weight:700;font-size:14px;padding:0;text-decoration:underline}
.toast.act{pointer-events:auto}

/* ---------- unsaved-changes bar ---------- */
.dirtybar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;gap:10px;padding:10px 18px;
  background:var(--w);border-top:1px solid var(--g2);box-shadow:0 -4px 16px rgba(0,0,0,.06);font-size:14px}
.dirtybar.on{display:flex}
.dirtybar .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0}
.dirtybar .sp{flex:1}
.dirtybar small{color:var(--g5)}
body.has-dirty .main{padding-bottom:80px}
.restore{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;border:1px solid #f0d58a;background:var(--warnbg);border-radius:var(--rad);font-size:14px;color:var(--g7)}
.restore .sp{flex:1}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}

/* ---------- dialog ---------- */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(20,20,20,.45);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:100%;max-width:480px;max-height:calc(100dvh - 36px);overflow-y:auto;background:var(--w);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:18px;font-weight:800;padding:20px 22px 4px;line-height:1.3}
.modal .mb{padding:4px 22px 16px;font-size:14px;color:var(--g6)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--g1);background:var(--g0)}
.chk{list-style:none;margin:10px 0 0}
.chk li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--g1);color:var(--g7)}
.chk .m{width:16px;flex-shrink:0;font-weight:800;text-align:center}
.chk .y{color:var(--ok)}.chk .n{color:var(--red)}.chk .w{color:var(--warn)}
.chk .lk{border:none;background:none;color:var(--red);font-weight:700;font-size:14px;padding:0 2px;white-space:nowrap;text-decoration:underline}
.goes{margin-top:14px;padding:12px 14px;border-radius:9px;background:#fbefeb;border:1px solid #f1d6cc;color:var(--g7)}
.goes b{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.spin{width:18px;height:18px;border:2px solid var(--g2);border-top-color:var(--red);border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:820px){
  .shell.on{grid-template-columns:1fr}
  .hamburger{display:block}
  .side{position:fixed;top:58px;bottom:0;left:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.35);z-index:35}
  .main{padding:16px}
  .row2,.row3{grid-template-columns:1fr}
  .brand span{display:none}
  .userchip .em{display:none}
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- ============ SIGN-IN GATE ============ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <img src="logo.png" alt="The Utah View">
    <div class="gate-title">Editor</div>
    <p class="gate-sub">Sign in with an approved Google account.</p>
    <div id="gBtn"></div>
    <button class="gate-fallback" onclick="gSignIn()">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <span class="gate-note">Access is limited to accounts added under Access.</span>
    <p class="gate-err" id="gErr">This Google account isn't authorized. Contact <strong>theutahview@gmail.com</strong>.</p>
    <a href="/" class="gate-home">&larr; Back to site</a>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div class="shell" id="shell">
  <div class="topbar">
    <button class="hamburger" onclick="toggleNav()" aria-label="Menu">&#9776;</button>
    <a class="brand" href="#" onclick="go('dashboard');return false"><img src="logo.png" alt=""><b>The Utah View</b><span>Editor</span></a>
    <div class="top-right">
      <a class="viewsite" href="/" target="_blank">View site &#8599;</a>
      <div class="userchip"><div class="avatar" id="uAv"></div><span class="em" id="uEm"></span></div>
      <button class="signout" onclick="out()">Sign out</button>
    </div>
  </div>
  <div class="scrim" id="scrim" onclick="toggleNav(false)"></div>
  <nav class="side" id="side">
    <div class="side-hd">Overview</div>
    <button class="nav" data-v="dashboard" onclick="go('dashboard')"><span class="ic">&#9632;</span> Dashboard</button>
    <div class="side-hd">Content</div>
    <button class="nav" data-v="stories" onclick="go('stories')"><span class="ic">&#128240;</span> Stories</button>
    <button class="nav" data-v="images" onclick="go('images')"><span class="ic">&#128444;</span> Images</button>
    <button class="nav" data-v="pages" data-admin onclick="go('pages')"><span class="ic">&#128196;</span> Pages</button>
    <button class="nav" data-v="reports" onclick="go('reports')"><span class="ic">&#9888;</span> Reader reports <span id="repN" class="badge" hidden></span></button>
    <div class="side-hd" data-admin>Front page</div>
    <button class="nav" data-v="homepage" data-admin onclick="go('homepage')"><span class="ic">&#127968;</span> Homepage</button>
    <button class="nav" data-v="footer" data-admin onclick="go('footer')"><span class="ic">&#128279;</span> Footer &amp; Subscribe</button>
    <div class="side-hd" data-admin>Admin</div>
    <button class="nav" data-v="access" data-admin onclick="go('access')"><span class="ic">&#128273;</span> Access</button>
    <button class="nav" data-v="subs" data-admin onclick="go('subs')"><span class="ic">&#128236;</span> Subscribers</button>
    <button class="nav" data-v="activity" data-admin onclick="go('activity')"><span class="ic">&#128203;</span> Activity &amp; backup</button>
    <div class="side-foot">Signed in as <strong id="uEm2"></strong></div>
  </nav>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dirtybar" id="dirtybar" role="region" aria-label="Unsaved changes"><span class="dot"></span><span><b>Unsaved changes</b> <small id="dirtyNote"></small></span><span class="sp"></span><button class="bt bs bsm" onclick="discardChanges()">Discard</button><button class="bt bp bsm" id="dirtySave" onclick="dirtySave()">Save</button></div>

<script src="/site-defaults.js"></script>
<script>
var API='https://api.theutahview.com',GC='562818410025-d6n1627aucueem1npk03mg5n7gs8i5t7.apps.googleusercontent.com';
if(!localStorage.getItem('utv_acl'))localStorage.setItem('utv_acl',JSON.stringify({'theutahview@gmail.com':'admin'}));
var apiOk=false,editId=null,editSlug=null,storyFilter='all',storyQuery='',curView='dashboard';

/* ---------- tiny helpers ---------- */
function $(id){return document.getElementById(id)}
function g(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}}
function s(k,v){localStorage.setItem(k,JSON.stringify(v))}
function user(){return g('utv_user')}
function acl(){return g('utv_acl')}
function stories(){return g('utv_stories')}
function pages(){return g('utv_pages')}
function layout(){return g('utv_layout')}
function site(){return g('utv_site')}
function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function sel(v,o){return v===o?' selected':''}
function token(){return localStorage.getItem('utv_token')||''}
function hd(){return{'Authorization':'Bearer '+token(),'Content-Type':'application/json'}}
function tokenExpMs(){try{return (JSON.parse(atob(token().split('.')[1])).exp||0)*1000}catch(e){return 0}}
function tokenFresh(){return !!token()&&tokenExpMs()>Date.now()+20000}
var _pendingRefresh=null;
// Google ID tokens expire after ~1h; silently re-issue one before an admin call
// whose token has gone stale, so saves/grants don't fail with a 403.
function refreshToken(){return new Promise(function(resolve){
  if(tokenFresh()){resolve(true);return;}
  if(typeof google==='undefined'||!google.accounts){resolve(false);return;}
  _pendingRefresh=resolve;toast('Refreshing session…');
  try{google.accounts.id.prompt();}catch(e){_pendingRefresh=null;resolve(false);return;}
  setTimeout(function(){if(_pendingRefresh){_pendingRefresh=null;resolve(false);}},6000);
})}
function rawApi(m,p,b){return fetch(API+p,{method:m,headers:hd(),body:b?JSON.stringify(b):undefined}).then(function(r){apiOk=true;return r;})}
function api(m,p,b){if(tokenFresh())return rawApi(m,p,b);return refreshToken().then(function(){return rawApi(m,p,b)})}
// Errors (⚠️) stay on screen until closed or replaced and are announced
// right away; everything else fades after a few seconds. opt.undo adds an
// Undo button, and opt.ms sets how long the toast stays.
function toast(m,opt){opt=opt||{};var t=$('toast'),err=/^⚠️/.test(String(m));clearTimeout(t._t);
  t.className='toast show'+(err?' err':'')+(opt.undo?' act':'');t.setAttribute('role',err?'alert':'status');
  t.innerHTML=m+(opt.undo?'<button class="undo" onclick="toastUndo()">Undo</button>':'')+(err?'<button class="tx" aria-label="Close message" onclick="hideToast()">&times;</button>':'');
  t._undo=opt.undo||null;if(!err)t._t=setTimeout(hideToast,opt.ms||2800)}
function hideToast(){var t=$('toast');clearTimeout(t._t);t.classList.remove('show');t._undo=null}
function toastUndo(){var t=$('toast'),u=t._undo;hideToast();if(u)u()}
/* ---------- in-page dialog (the browser's confirm() can't explain enough) ---------- */
function modal(title,body,buttons){closeModal();var bg=document.createElement('div');bg.className='modal-bg';bg.id='modalBg';
  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">'+title+'</h2><div class="mb">'+body+'</div><div class="mf">'+
    buttons.map(function(b,i){return '<button class="bt '+(b.cls||'bs')+'" id="mBtn'+i+'"'+(b.disabled?' disabled style="opacity:.45;cursor:not-allowed"':'')+'>'+b.label+'</button>'}).join('')+'</div></div>';
  document.body.appendChild(bg);
  buttons.forEach(function(b,i){$('mBtn'+i).onclick=function(){if(b.disabled)return;closeModal();if(b.run)b.run()}});
  bg.addEventListener('click',function(e){if(e.target===bg)closeModal()});
  var f=buttons.length-1;while(f>0&&buttons[f].disabled)f--;$('mBtn'+f).focus();
}
function closeModal(){var m=$('modalBg');if(m)m.remove()}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modalBg'))closeModal()});
function fmtDate(d){if(!d)return'';try{return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return d}}
function today(){return new Date().toISOString().split('T')[0]}
function isAdmin(){var u=user();return u&&u.role==='admin'}

/* ---------- auth (Google only, no key in source) ---------- */
function onCred(r){
  localStorage.setItem('utv_token',r.credential);
  if(_pendingRefresh){var done=_pendingRefresh;_pendingRefresh=null;done(true);return;}
  var p=JSON.parse(atob(r.credential.split('.')[1]));tryAuth(p.email.toLowerCase(),p.name||p.email,p.picture||'');
}
function initGoogle(){
  if(typeof google==='undefined'||!google.accounts)return;
  var c=$('gBtn');if(!c){document.addEventListener('DOMContentLoaded',initGoogle);return;}
  google.accounts.id.initialize({client_id:GC,callback:onCred,auto_select:true});
  google.accounts.id.renderButton(c,{theme:'outline',size:'large',type:'standard',text:'signin_with',shape:'pill',width:260});
}
window.onGoogleLibraryLoad=initGoogle;
document.addEventListener('DOMContentLoaded',function(){if(typeof google!=='undefined'&&google.accounts)initGoogle();});
function gSignIn(){
  if(typeof google==='undefined'||!google.accounts){$('gErr').textContent='Google Sign-In is still loading — try again in a moment.';$('gErr').classList.add('show');return;}
  try{google.accounts.id.initialize({client_id:GC,callback:onCred});google.accounts.id.prompt();}
  catch(e){$('gErr').classList.add('show');}
}
function tryAuth(email,name,pic){
  var u={email:email,name:name,initial:(name||email).charAt(0).toUpperCase(),picture:pic||''};s('utv_user',u);
  fetch(API+'/api/me',{headers:{'Authorization':'Bearer '+token()}}).then(function(r){return r.json()}).then(function(d){
    if(d.role==='admin'||d.role==='editor'){u.role=d.role;s('utv_user',u);var a=acl();a[email]=d.role;s('utv_acl',a);$('gErr').classList.remove('show');enter();}
    else deny();
  }).catch(deny);
}
function deny(){localStorage.removeItem('utv_token');var u=user();if(u&&u.email){delete u.role;s('utv_user',u)}$('gErr').classList.add('show')}
function check(){if(!token())return;fetch(API+'/api/me',{headers:{'Authorization':'Bearer '+token()}}).then(function(r){return r.json()}).then(function(d){if(d.role==='admin'||d.role==='editor'){var u=user()||{};u.role=d.role;if(!u.email&&d.email)u.email=d.email;if(!u.initial)u.initial=(u.email||'?').charAt(0).toUpperCase();s('utv_user',u);enter();}else deny();}).catch(function(){})}
function out(){localStorage.removeItem('utv_user');localStorage.removeItem('utv_token');location.reload()}
function enter(){
  var u=user();
  $('gate').style.display='none';$('shell').classList.add('on');
  $('uAv').textContent=u.initial||'';$('uEm').textContent=u.email||'';$('uEm2').textContent=u.email||'';
  if(u.picture){$('uAv').style.backgroundImage='url('+u.picture+')';$('uAv').style.backgroundSize='cover';$('uAv').textContent='';}
  var admin=u.role==='admin';
  document.querySelectorAll('[data-admin]').forEach(function(el){el.style.display=admin?'':'none'});
  refreshAll();
  go('dashboard');
}
function toggleNav(force){var sd=$('side'),sc=$('scrim');var open=force===undefined?!sd.classList.contains('open'):force;sd.classList.toggle('open',open);sc.classList.toggle('show',open)}

/* ---------- unsaved changes ---------- */
// Any typing in an edit screen marks it dirty: a bar offers Save / Discard,
// leaving asks first, and the story and page editors keep a copy in this
// browser every couple of seconds so a closed tab or crash loses nothing.
var EDIT_VIEWS={story:1,page:1,homepage:1,footer:1},dirty=false,_auto=null;
function markDirty(){if(!EDIT_VIEWS[curView])return;if(!dirty){dirty=true;$('dirtybar').classList.add('on');document.body.classList.add('has-dirty');$('dirtySave').textContent=saveLabel();}
  clearTimeout(_auto);_auto=setTimeout(autosave,1500)}
function clearDirty(){dirty=false;clearTimeout(_auto);$('dirtybar').classList.remove('on');document.body.classList.remove('has-dirty');$('dirtyNote').textContent=''}
function saveLabel(){if(curView==='story')return storyIsLive()?'Update':'Save draft';if(curView==='page')return 'Save page';if(curView==='homepage')return 'Save homepage';return 'Save'}
function dirtySave(){if(curView==='story'){if(storyIsLive())updateLive();else saveFromForm('draft');}else if(curView==='page')savePage();else if(curView==='homepage')saveHome();else if(curView==='footer')saveFooter()}
function discardChanges(){modal('Discard your changes?','Everything you changed since the last save on this screen goes back to how it was.',[{label:'Keep editing'},{label:'Discard',cls:'bd',run:function(){dropLocal();clearDirty();if(curView==='story'&&editId)editStory(editId,true);else if(curView==='page')editPage(editSlug);else render();}}])}
function localKey(){if(curView==='story')return 'utv_local_story_'+(editId||'new');if(curView==='page')return 'utv_local_page_'+(editSlug||'new');return ''}
function autosave(){var k=localKey();if(!k||!dirty)return;var d;
  if(curView==='story'&&$('ft'))d={title:$('ft').value,author:$('fa').value,region:$('fr').value,date:$('fd').value,read_time:$('frt').value,summary:$('fsum').value,image_url:$('fimg').value,image_caption:$('fcap').value,image_credit:$('fcred').value,body:$('fbody').innerHTML};
  else if(curView==='page'&&$('pt'))d={title:$('pt').value,subtitle:$('psub').value,slug:$('pslug')?$('pslug').value:'',body:$('pbody').innerHTML};
  if(!d)return;d.saved_at=Date.now();try{localStorage.setItem(k,JSON.stringify(d))}catch(e){}
  $('dirtyNote').textContent='· copy kept in this browser '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function dropLocal(k){k=k||localKey();if(k)try{localStorage.removeItem(k)}catch(e){}}
function localCopy(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
// Offer back an unsaved copy left by a closed tab, if it differs from what's saved.
function offerRestore(k,cur,fill){var c=localCopy(k);if(!c)return;var diff=Object.keys(c).some(function(f){return f!=='saved_at'&&f!=='slug'&&String(c[f]||'')!==String(cur[f]||'')});
  if(!diff){dropLocal(k);return;}
  var bar=document.createElement('div');bar.className='restore';bar.innerHTML='<span>You have unsaved changes from <b>'+new Date(c.saved_at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</b> that weren’t saved.</span><span class="sp"></span>';
  var no=document.createElement('button');no.className='bt bs bsm';no.textContent='Throw away';no.onclick=function(){dropLocal(k);bar.remove()};
  var yes=document.createElement('button');yes.className='bt bp bsm';yes.textContent='Restore them';yes.onclick=function(){fill(c);bar.remove();markDirty()};
  bar.appendChild(no);bar.appendChild(yes);var v=$('view');v.insertBefore(bar,v.children[1]||null)}
// Leaving an edit screen with unsaved changes asks first.
function guard(next){if(!dirty){next();return;}modal('Leave without saving?','Your changes on this screen haven’t been saved. If you leave now they’re lost'+(localKey()?' (a copy stays in this browser and is offered back next time you open it)':'')+'.',[{label:'Stay'},{label:'Leave',cls:'bd',run:function(){clearDirty();next()}}])}
window.addEventListener('beforeunload',function(e){if(dirty){autosave();e.preventDefault();e.returnValue='';}});
document.addEventListener('input',function(e){if($('view')&&$('view').contains(e.target))markDirty()});
document.addEventListener('change',function(e){if($('view')&&$('view').contains(e.target)&&e.target.tagName==='SELECT')markDirty()});

/* ---------- data refresh ---------- */
function refreshAll(){repCount();
  api('GET','/api/admin/stories').then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.stories){apiOk=true;var S=stories();var N={};d.stories.forEach(function(x){var old=S[x.id]||{};N[x.id]=x;if(!x.body&&old.body)N[x.id].body=old.body});s('utv_stories',N);if(curView==='dashboard')vDashboard();else if(curView==='stories')renderStoryList();}}).catch(function(){});
  fetch(API+'/api/pages').then(function(r){return r.json()}).then(function(d){var P={},ex=pages();(d.pages||[]).forEach(function(p){P[p.slug]=p;if(!p.body&&ex[p.slug]&&ex[p.slug].body)P[p.slug].body=ex[p.slug].body});s('utv_pages',P);if(curView==='pages')render();else if(curView==='dashboard')vDashboard();}).catch(function(){});
  fetch(API+'/api/config/layout').then(function(r){return r.json()}).then(function(d){if(d.value)s('utv_layout',d.value)}).catch(function(){});
  fetch(API+'/api/config/site').then(function(r){return r.json()}).then(function(d){if(d.value)s('utv_site',d.value)}).catch(function(){});
}

/* ---------- router ---------- */
// Admin-only screens: editors are sent to the dashboard instead of a panel
// whose saves the server would refuse.
var ADMIN_VIEWS=['pages','page','homepage','footer','access','subs'];
function go(v){guard(function(){goNow(v)})}
function goNow(v){if(!isAdmin()&&ADMIN_VIEWS.indexOf(v)>=0)v='dashboard';curView=v;editId=null;editSlug=null;
  if(window.innerWidth<=820)toggleNav(false);
  if($('main'))$('main').scrollTop=0;
  render();
}
function render(){
  if(!isAdmin()&&ADMIN_VIEWS.indexOf(curView)>=0)curView='dashboard';
  var v=curView,nv=v==='story'?'stories':v==='page'?'pages':v;
  document.querySelectorAll('.nav').forEach(function(n){n.classList.toggle('on',n.getAttribute('data-v')===nv)});
  if(!EDIT_VIEWS[v])clearDirty();
  if(v==='dashboard')return vDashboard();
  if(v==='stories')return vStories();
  if(v==='story')return vStoryEdit();
  if(v==='pages')return vPages();
  if(v==='page')return vPageEdit();
  if(v==='homepage')return vHomepage();
  if(v==='footer')return vFooter();
  if(v==='access')return vAccess();
  if(v==='subs')return vSubs();
  if(v==='activity')return vActivity();
  if(v==='images')return vImages();
  if(v==='reports')return vReports();
}
function head(title,actionsHtml){return '<div class="page-head"><h1>'+title+'</h1><div class="sp"></div>'+(actionsHtml||'')+'</div>'}

/* ---------- DASHBOARD ---------- */
function vDashboard(){
  var S=stories(),ids=Object.keys(S).filter(function(i){return !pendingDel[i]});
  var pub=ids.filter(function(i){return S[i].status==='published'}).length;
  var dr=ids.length-pub;
  var pg=Object.keys(pages()).length;
  var recent=ids.map(function(i){return S[i]}).sort(function(a,b){return (b.updated_at||b.date||'').localeCompare(a.updated_at||a.date||'')}).slice(0,6);
  var h=head('Good to see you');
  h+='<div class="grid stats" style="margin-bottom:16px">'+
     '<div class="stat"><div class="n">'+pub+'</div><div class="l red">Published</div></div>'+
     '<div class="stat"><div class="n">'+dr+'</div><div class="l">Drafts</div></div>'+
     '<div class="stat"><div class="n">'+pg+'</div><div class="l">Pages</div></div>'+
     (isAdmin()?'<div class="stat"><div class="n" id="subCount">—</div><div class="l">Subscribers</div></div>':'')+'</div>';
  h+='<div class="grid quick" style="margin-bottom:18px">'+
     '<button class="qbtn" onclick="newStory()"><span class="qic">+</span><span><b>New story</b><small>Write &amp; publish</small></span></button>'+
     (isAdmin()?'<button class="qbtn" onclick="go(\'homepage\')"><span class="qic">&#127968;</span><span><b>Edit homepage</b><small>Arrange the front page</small></span></button>':'')+
     (isAdmin()?'<button class="qbtn" onclick="go(\'pages\')"><span class="qic">&#128196;</span><span><b>Pages</b><small>About, Contact…</small></span></button>':'')+
     (isAdmin()?'<button class="qbtn" onclick="go(\'access\')"><span class="qic">&#128273;</span><span><b>Access</b><small>Who can edit</small></span></button>':'')+'</div>';
  h+='<div class="card"><h2>Recent stories</h2>';
  if(!recent.length)h+='<p class="empty">No stories yet. Click <b>New story</b> to begin.</p>';
  else{h+='<div style="margin:4px -4px -4px">';recent.forEach(function(x){h+=storyRow(x)});h+='</div>';}
  h+='</div>';
  $('view').innerHTML=h;
  if(isAdmin())api('GET','/api/admin/subscribers').then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&$('subCount'))$('subCount').textContent=d.count}).catch(function(){});
}

/* ---------- STORIES ---------- */
function storyRow(x){
  var live=x.status==='published';
  var thumb=x.image_url
    ? '<img src="'+esc(x.image_url)+'" alt="" title="Has a photo — click to edit" onclick="editStory(\''+x.id+'\')" style="width:46px;height:46px;object-fit:cover;border-radius:6px;flex-shrink:0;cursor:pointer;border:1px solid var(--g2)">'
    : '<div onclick="editStory(\''+x.id+'\')" title="No photo yet — click to add one" style="width:46px;height:46px;border-radius:6px;background:var(--g1);display:flex;align-items:center;justify-content:center;color:var(--g4);font-size:17px;flex-shrink:0;cursor:pointer">&#128247;</div>';
  return '<div class="row">'+thumb+'<span class="badge '+(live?'live':'draft')+'">'+(live?'Live':'Draft')+'</span>'+
    '<div class="meta"><span class="ti" onclick="editStory(\''+x.id+'\')">'+esc(x.title||'(untitled)')+'</span>'+
    '<div class="su">'+esc(x.region||'')+(x.author?' · '+esc(x.author):'')+(x.date?' · '+fmtDate(x.date):'')+'</div></div>'+
    '<div class="acts">'+
      '<button class="btn-ghost" title="Edit" aria-label="Edit story" onclick="editStory(\''+x.id+'\')">&#9998;</button>'+
      '<button class="btn-ghost" title="Duplicate" aria-label="Duplicate story" onclick="dupStory(\''+x.id+'\')">&#10697;</button>'+
      (isAdmin()?'<button class="btn-ghost" title="Delete" aria-label="Delete story" onclick="delStory(\''+x.id+'\')">&#128465;</button>':'')+
    '</div></div>';
}
function vStories(){
  var h=head('Stories','<button class="bt bp" onclick="newStory()">+ New story</button>');
  h+='<div class="toolbar">'+
     '<div class="searchbox">&#128269;<input id="sq" placeholder="Search stories…" value="'+esc(storyQuery)+'" oninput="storyQuery=this.value;renderStoryList()"></div>'+
     '<div class="segment">'+
       ['all','published','draft'].map(function(f){return '<button class="'+(storyFilter===f?'on':'')+'" onclick="setFilter(\''+f+'\')">'+(f==='all'?'All':f==='published'?'Live':'Drafts')+'</button>'}).join('')+
     '</div></div><div id="storyList"></div>';
  $('view').innerHTML=h;renderStoryList();
}
function setFilter(f){storyFilter=f;document.querySelectorAll('.segment button').forEach(function(b){b.classList.toggle('on',b.textContent===(f==='all'?'All':f==='published'?'Live':'Drafts'))});renderStoryList()}
function renderStoryList(){
  var S=stories();var arr=Object.keys(S).filter(function(i){return !pendingDel[i]}).map(function(i){return S[i]});
  arr=arr.filter(function(x){
    if(storyFilter==='published'&&x.status!=='published')return false;
    if(storyFilter==='draft'&&x.status==='published')return false;
    if(storyQuery){var q=storyQuery.toLowerCase();return (x.title||'').toLowerCase().indexOf(q)>=0||(x.author||'').toLowerCase().indexOf(q)>=0||(x.region||'').toLowerCase().indexOf(q)>=0}
    return true;
  }).sort(function(a,b){return (b.updated_at||b.date||'').localeCompare(a.updated_at||a.date||'')});
  var el=$('storyList');if(!el)return;
  if(!arr.length){el.innerHTML='<div class="list"><p class="empty">No stories'+(storyQuery?' match “'+esc(storyQuery)+'”':storyFilter!=='all'?' in this view':'')+'.</p></div>';return;}
  el.innerHTML='<div class="list">'+arr.map(storyRow).join('')+'</div>';
}
function newStory(){guard(function(){editId=null;curView='story';render()})}
// Opening a story pulls the server's latest copy. If nothing has been typed
// yet the form is redrawn from it, and its updated_at becomes the version
// this edit started from (used to spot someone else's save in between).
var baseUpdated='';
function editStory(id,now){if(!now&&curView!=='story'){guard(function(){editStory(id,true)});return;}
  editId=id;curView='story';baseUpdated=(stories()[id]||{}).updated_at||'';render();
  if(apiOk)api('GET','/api/stories/'+id).then(function(r){return r.ok?r.json():null}).then(function(x){if(x){var S=stories();S[id]=Object.assign(S[id]||{},x);s('utv_stories',S);if(curView==='story'&&editId===id&&!dirty){baseUpdated=x.updated_at||'';vStoryEdit();}}}).catch(function(){});
}
function storyIsLive(){var x=editId&&stories()[editId];return !!(x&&x.status==='published')}
function dupStory(id){var S=stories();var x=S[id];if(!x)return;dupSeed={title:(x.title||'Untitled')+' (copy)',author:x.author||'',region:x.region||'Global',summary:x.summary||'',body:x.body||'',read_time:x.read_time||x.readTime||'',image_url:x.image_url||'',image_caption:x.image_caption||'',image_credit:x.image_credit||'',status:'draft',date:today()};editId=null;curView='story';render();}
var dupSeed=null;
// Delete on the server first; only drop the story here once the server agrees,
// so a refused delete doesn't make it vanish from the list.
// Delete waits 8 seconds with an Undo before anything is sent, then only
// drops the story here once the server agrees. Until then it's just hidden.
var pendingDel={};
function delStory(id){
  if(!apiOk){toast('⚠️ Not connected — nothing deleted. Try again in a moment.');return;}
  var x=stories()[id]||{},t=x.title||'this story';
  if(x.status==='published'){modal('Delete a live story?','<b>'+esc(t)+'</b> is on the website now. Deleting it removes it from the site and the apps, and any links to it stop working. If you only want it off the site, unpublish it instead.',[{label:'Cancel'},{label:'Delete',cls:'bd',run:function(){queueDel(id,t)}}]);return;}
  queueDel(id,t);
}
function queueDel(id,t){pendingDel[id]=setTimeout(function(){sendDel(id)},8000);
  if(curView==='story'){clearDirty();dropLocal();goNow('stories');}else render();
  toast('Deleted “'+esc(t.length>40?t.slice(0,40)+'…':t)+'”',{ms:8000,undo:function(){clearTimeout(pendingDel[id]);delete pendingDel[id];render();toast('Delete undone')}});
}
function sendDel(id){delete pendingDel[id];
  function drop(){var S=stories();delete S[id];s('utv_stories',S);render();}
  api('DELETE','/api/admin/stories/'+id).then(function(r){if(r.ok)drop();else{render();toast(r.status===401||r.status===403?'⚠️ Only admins can delete stories. Nothing was deleted.':'⚠️ Delete failed. The story is still there.')}}).catch(function(){render();toast('⚠️ Network error. Nothing was deleted.')});
}
window.addEventListener('beforeunload',function(){Object.keys(pendingDel).forEach(function(id){clearTimeout(pendingDel[id]);fetch(API+'/api/admin/stories/'+id,{method:'DELETE',headers:hd(),keepalive:true})})});
function vStoryEdit(){
  var x=editId?stories()[editId]:(dupSeed||null);dupSeed=null;

function wordCount(){var t=($('fbody')?$('fbody').innerText:'').replace(/Start writing…/,'').trim();return t?t.split(/\s+/).length:0}
function fixField(id){var el=$(id);if(el){el.scrollIntoView({block:'center'});el.focus()}}
// Publish opens a short checklist and says exactly what going live does,
// because the first publish also notifies app readers and that can't be recalled.

    [w>=50?'y':'w',w+(w===1?' word':' words')+(w?' · about '+Math.max(1,Math.round(w/230))+' min read':''),'fbody']

    '<div class="goes"><b>Publishing will</b>Put the story on theutahview.com and in the apps. The first time a story goes live it also sends a push notification to app readers and, if auto-post is switched on, posts it to Instagram. Those can’t be taken back.</div>';
  modal(blocked?'Not ready to publish yet':'Publish “'+esc(t.length>60?t.slice(0,60)+'…':t)+'”?',body,[{label:'Cancel'},{label:'Publish now',cls:'bp',disabled:blocked,run:function(){saveFromForm('published')}}]);
}

function updateLive(){checkFresh(function(){saveFromForm('published')})}
// Before saving over an existing story, look at the server's copy. If someone
// saved it after this edit started, say who and when instead of silently
// overwriting their work.
function checkFresh(next){
  if(!editId||!apiOk||!baseUpdated){next();return;}
  api('GET','/api/stories/'+editId).then(function(r){return r.ok?r.json():null}).then(function(x){
    if(!x||!x.updated_at||x.updated_at<=baseUpdated){next();return;}
    var who=x.updated_by&&x.updated_by!==(user()||{}).email?esc(x.updated_by):'Someone (maybe you, in another tab)';
    modal('This story changed while you were editing',who+' saved it at <b>'+esc(fmtTime(x.updated_at))+'</b>, after you opened it. Saving now replaces their version with yours.',
      [{label:'Cancel'},{label:'See their version',run:function(){clearDirty();dropLocal();var S=stories();S[editId]=Object.assign(S[editId]||{},x);s('utv_stories',S);editStory(editId,true)}},{label:'Save mine anyway',cls:'bd',run:next}]);
  }).catch(function(){next()});
}
function fmtTime(ts){try{var d=new Date(String(ts).replace(' ','T')+(/Z|[+-]\d\d:?\d\d$/.test(ts)?'':'Z'));return d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return ts}}
function rc(c){document.execCommand(c,false,null);$('fbody').focus()}
function rb(t){document.execCommand('formatBlock',false,'<'+t+'>');$('fbody').focus()}
// Insert an in-body image WITH its own caption + credit, wrapped in a
// <figure>/<figcaption> so both show under the photo (every image is credited).
function iImg(bodyId){bodyId=bodyId||'fbody';
  // keep the cursor position: the upload/prompt steps take focus away
  var sel=window.getSelection(),rng=sel.rangeCount&&$(bodyId).contains(sel.anchorNode)?sel.getRangeAt(0):null;
  getImgUrl(function(url){
    var cap=(prompt('Caption for this image (what it shows) — optional:','')||'').trim();
    var cred=(prompt('Credit — e.g. "Photo: Jane Doe / Source" — optional:','')||'').trim();
    var fc=(cap||cred)?'<figcaption>'+esc(cap)+((cap&&cred)?' — ':'')+esc(cred)+'</figcaption>':'';
    $(bodyId).focus();if(rng){sel.removeAllRanges();sel.addRange(rng)}
    document.execCommand('insertHTML',false,'<figure><img src="'+esc(url)+'" alt="'+esc(cap)+'">'+fc+'</figure><p><br></p>');
    if(bodyId==='fbody')sPv();else pPv();
  });
}
// Link the selected words (or insert the address itself when nothing is
// selected). Only web, mail and site-relative links are allowed.
function iLink(bodyId){
  var el=$(bodyId),sel=window.getSelection();
  var rng=sel.rangeCount&&el.contains(sel.anchorNode)?sel.getRangeAt(0).cloneRange():null;
  var url=(prompt('Link address (e.g. https://example.com or /article.html?id=…):','https://')||'').trim();
  if(!url||url==='https://')return;
  if(/^www\./i.test(url))url='https://'+url;
  if(!/^(https?:\/\/|mailto:|\/|#)/i.test(url)){toast('⚠️ Use a full address starting with https://');return;}
  el.focus();if(rng){sel.removeAllRanges();sel.addRange(rng)}
  if(rng&&!rng.collapsed)document.execCommand('createLink',false,url);
  else document.execCommand('insertHTML',false,'<a href="'+esc(url)+'">'+esc(url.replace(/^https?:\/\//,''))+'</a>&nbsp;');
  if(bodyId==='fbody')sPv();else pPv();
}
function getImgUrl(cb){
  if(confirm('OK = upload an image file.   Cancel = paste an image URL.')){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var fd=new FormData();fd.append('file',f);toast('Uploading…');
      fetch(API+'/api/upload',{method:'POST',headers:{'Authorization':'Bearer '+token()},body:fd}).then(function(r){return r.json()}).then(function(d){if(d.url)cb(d.url);else toast('⚠️ '+(d.error||'Upload failed'))}).catch(function(){toast('⚠️ Upload failed')});};
    inp.click();
  }else{var u=prompt('Image URL:');if(u&&u.trim())cb(u.trim());}
}
function sPv(){var el=$('spv');if(!el)return;var img=$('fimg')?$('fimg').value.trim():'',cap=$('fcap')?$('fcap').value.trim():'',cred=$('fcred')?$('fcred').value.trim():'';var lead=img?'<img src="'+esc(img)+'" style="width:100%;border-radius:4px;display:block">'+((cap||cred)?'<div style="font-size:12px;color:#777;margin:6px 0 14px">'+esc(cap)+(cap&&cred?' — ':'')+esc(cred)+'</div>':'<div style="margin-bottom:14px"></div>'):'';el.innerHTML=lead+'<div class="pr">'+esc($('fr')?$('fr').value:'')+'</div><div class="pt">'+(esc($('ft').value)||'Untitled')+'</div><div class="ps">'+esc($('fsum')?$('fsum').value:'')+'</div><div class="pm">By <b>'+esc($('fa')?$('fa').value:'')+'</b></div><div class="pc">'+($('fbody')?$('fbody').innerHTML:'')+'</div>'}
function collectStory(status){
  var t=$('ft').value.trim(),a=$('fa').value.trim();
  var id=editId||freeId(t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').substring(0,60)||('story-'+Date.now()));
  var rt=$('frt').value.trim();
  return {id:id,title:t,author:a,region:$('fr').value,status:status,summary:$('fsum').value.trim(),
    body:$('fbody').innerHTML,read_time:rt,readTime:rt,date:$('fd').value||today(),
    image_url:$('fimg')?$('fimg').value.trim():'',image_caption:$('fcap')?$('fcap').value.trim():'',image_credit:$('fcred')?$('fcred').value.trim():''};
}
// A new story's address comes from its headline. If that address is already
// taken (by any story, draft or live), add -2, -3… so it never replaces it.
function freeId(base,taken){var S=stories(),id=base,n=1;while(S[id]||(taken&&taken[id]))id=base+'-'+(++n);return id}
// Create a new story. If the server says the address is taken (a story this
// browser hasn't seen yet), try the next free one.
function createStory(d,base,taken,tries){
  if(!apiOk){toast('⚠️ Not connected — story not saved. Try again in a moment.');return Promise.resolve(false);}
  base=base||d.id;taken=taken||{};tries=tries||0;
  return api('POST','/api/admin/stories',d).then(function(r){
    if(r.status===409&&tries<20){taken[d.id]=1;d.id=freeId(base,taken);return createStory(d,base,taken,tries+1);}
    if(!r.ok){toast(r.status===401||r.status===403?'⚠️ Not authorized':'⚠️ Save error');return false;}
    return true;
  }).catch(function(){toast('⚠️ Network error');return false;});
}
function saveFromForm(status,done){
  var t=$('ft').value.trim(),a=$('fa').value.trim();
  if(!t||!a){toast('⚠️ Headline and author are required. Fill them in, then save again.');fixField(t?'fa':'ft');return;}
  var d=collectStory(status),existed=!!editId,S=stories();var wasLive=existed&&storyIsLive();
  if(existed){S[d.id]=d;s('utv_stories',S);}
  (existed?saveStory(d,true):createStory(d)).then(function(ok){
    // On failure stay on the form (the error toast is showing) so nothing typed is lost.
    if(!ok)return;
    // Note our own save's time so reopening this story doesn't mistake it for someone else's.
    S=stories();d.updated_at=new Date().toISOString().replace('T',' ').slice(0,19);S[d.id]=d;s('utv_stories',S);
    dropLocal('utv_local_story_'+(existed?d.id:'new'));clearDirty();
    if(done)done();else toast(status==='published'?(wasLive?'✅ Updated':'✅ Published — live now'):'💾 Draft saved');
    goNow('stories');
  });
}
function saveStory(d,existed){
  if(!apiOk){toast('⚠️ API offline — saved locally only');return Promise.resolve(false);}
  return api(existed?'PUT':'POST',existed?'/api/admin/stories/'+d.id:'/api/admin/stories',d)
    .then(function(r){if(!r.ok){if(r.status===401||r.status===403)toast('⚠️ Not authorized');else toast('⚠️ Save error');return false;}return true;})
    .catch(function(){toast('⚠️ Network error');return false;});
}

function rc2(c){document.execCommand(c,false,null);$('pbody').focus()}
function rb2(t){document.execCommand('formatBlock',false,'<'+t+'>');$('pbody').focus()}
function pPv(){var el=$('ppv');if(!el)return;el.innerHTML='<div class="pt">'+esc($('pt').value)+'</div><div class="ps">'+esc($('psub')?$('psub').value:'')+'</div><div class="pc">'+$('pbody').innerHTML+'</div>'}
// A typed slug gets the same cleanup as an auto one (lowercase, no spaces), so
// a slug like "About Us" can't produce a link that 404s.
function slugify(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').substring(0,40)}
function savePage(){var t=$('pt').value.trim();if(!t){toast('⚠️ The page needs a title.');fixField('pt');return;}var lk=localKey();if(dirty)autosave();var slug=editSlug||slugify($('pslug')?$('pslug').value:'')||slugify(t);
  var P=pages();P[slug]={slug:slug,title:t,subtitle:$('psub').value.trim(),body:$('pbody').innerHTML};s('utv_pages',P);editSlug=slug;
  if(apiOk)api('POST','/api/admin/pages',{slug:slug,title:t,subtitle:P[slug].subtitle,body:P[slug].body}).then(function(r){if(r.ok)dropLocal(lk);toast(r.ok?'💾 Saved':(r.status===403?'⚠️ Only admins can save pages.':'⚠️ The page didn’t save. Your copy is kept in this browser; open the page again to restore it.'))}).catch(function(){toast('⚠️ Network error. The page didn’t save; your copy is kept in this browser.')});
  else toast('⚠️ Not connected. The page didn’t save; your copy is kept in this browser.');

function delPage(sl){if(!confirm('Delete this page?'))return;

}

function storyOpts(v){var S=stories();var ar=Object.keys(S).map(function(i){return S[i]}).sort(function(a,b){return (a.title||'').localeCompare(b.title||'')});

function slots(label,prefix,arr,n){var h='';for(var i=0;i<n;i++)h+='<div class="fl"><label>'+label+' #'+(i+1)+'</label><select data-slot id="'+prefix+i+'">'+storyOpts((arr||[])[i]||'')+'</select></div>';return h}
// Re-pull the story list from the API and repopulate every slot dropdown in
// place, keeping each current selection — so stories published after the
// Homepage panel was opened become selectable without losing your work.
function refreshHomepageStories(btn){
  if(btn){btn.disabled=true;btn.textContent='Refreshing…';}
  var done=function(){if(btn){btn.disabled=false;btn.innerHTML='&#8635; Refresh stories';}};
  api('GET','/api/admin/stories').then(function(r){return r.ok?r.json():null}).then(function(d){
    if(d&&d.stories){var S={},cur=stories();d.stories.forEach(function(x){var old=cur[x.id]||{};S[x.id]=x;if(!x.body&&old.body)S[x.id].body=old.body;});s('utv_stories',S);
      if(curView==='homepage')document.querySelectorAll('select[data-slot]').forEach(function(sel){sel.innerHTML=storyOpts(sel.value);});
      if(btn)toast('✅ Stories updated');
    } else if(btn)toast('⚠️ Could not refresh');
    done();
  }).catch(function(){done();if(btn)toast('⚠️ Network error');});
}

function secInit(L){var o=(L.section_order&&L.section_order.length)?L.section_order.slice():SEC_IDS.slice();SEC_IDS.forEach(function(id){if(o.indexOf(id)<0)o.push(id)});o=o.filter(function(id){return SEC_IDS.indexOf(id)>=0});secOrder=o;secHidden=(L.hidden_sections||[]).slice();secLabels=Object.assign({},L.section_labels||{})}

function cleanLabels(){var o={};Object.keys(secLabels).forEach(function(k){var v=(secLabels[k]||'').trim();if(v)o[k]=v});return o}
function renderSections(){var el=$('secMgr');if(!el)return;el.innerHTML=secOrder.map(function(id,i){

// Every upload in storage. "In use" is worked out from the stories, pages and
// homepage this editor has loaded, so a photo that's still shown can't be
// deleted by accident.
var IMGS=[];
function imgUses(url){var u=[],S=stories(),P=pages(),L=layout();
  Object.keys(S).forEach(function(id){var x=S[id];if(x.image_url===url||(x.body||'').indexOf(url)>=0)u.push('story “'+(x.title||id)+'”')});
  Object.keys(P).forEach(function(sl){if((P[sl].body||'').indexOf(url)>=0)u.push('page “'+(P[sl].title||sl)+'”')});
  if(L.hero_image===url)u.push('the homepage photo');return u}
function vImages(){
  var h=head('Images','<button class="bt bp" onclick="uploadToLibrary()">&#8679; Upload image</button>');
  h+='<div class="card"><p class="desc" style="margin:0">Everything uploaded through the editor. Click <b>Copy link</b> to use a photo in a story, page or the homepage.</p></div><div id="imgGrid"><p class="empty"><span class="spin"></span> Loading…</p></div>';
  $('view').innerHTML=h;
  api('GET','/api/admin/images').then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(d){IMGS=(d.images||[]).sort(function(a,b){return String(b.uploaded||'').localeCompare(String(a.uploaded||''))});renderImgs()}).catch(function(){if($('imgGrid'))$('imgGrid').innerHTML='<p class="empty">Couldn’t load images (offline?).</p>'});
}
function renderImgs(){var el=$('imgGrid');if(!el)return;
  if(!IMGS.length){el.innerHTML='<p class="empty">No uploads yet.</p>';return;}
  el.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px">'+IMGS.map(function(x,i){var used=imgUses(x.url);
    return '<div class="card" style="padding:10px;margin:0"><a href="'+esc(x.url)+'" target="_blank" rel="noopener"><img src="'+esc(x.url)+'" alt="" loading="lazy" style="width:100%;height:130px;object-fit:cover;border-radius:4px;display:block;background:var(--g1,#eee)"></a>'+
      '<div class="su" style="margin:8px 0 6px;font-size:12px">'+esc(String(x.uploaded||'').slice(0,10))+' · '+Math.max(1,Math.round((x.size||0)/1024))+' KB'+(used.length?' · <b title="'+esc(used.join(', '))+'">in use</b>':'')+'</div>'+
      '<div style="display:flex;gap:6px"><button class="bt bs bsm" onclick="copyImg('+i+')">Copy link</button>'+(isAdmin()?'<button class="bt bd bsm" style="margin-left:auto" onclick="delImg('+i+')">Delete</button>':'')+'</div></div>'}).join('')+'</div>';
}
function copyImg(i){var u=IMGS[i].url;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('Link copied')}).catch(function(){prompt('Copy this link:',u)})}
function delImg(i){var x=IMGS[i],used=imgUses(x.url);
  if(!confirm(used.length?'This image is still used in '+used.join(', ')+'. Deleting it leaves a broken picture there. Delete anyway?':'Delete this image? This cannot be undone.'))return;
  api('DELETE','/api/admin/images?key='+encodeURIComponent(x.key)).then(function(r){if(r.ok){IMGS.splice(i,1);renderImgs();toast('Deleted')}else toast(r.status===401||r.status===403?'⚠️ Only admins can delete images':'⚠️ Delete failed')}).catch(function(){toast('⚠️ Network error')});
}
function uploadToLibrary(){var t=document.createElement('input');t.id='libTmp';t.type='hidden';document.body.appendChild(t);

}

      '<div class="acts">'+(st?'<button class="btn-ghost" title="Edit this story" data-id="'+esc(x.story_id)+'" onclick="editStory(this.dataset.id)">&#9998;</button>':'')+
      '<button class="btn-ghost" title="'+(x.status==='resolved'?'Reopen':'Mark resolved')+'" data-id="'+x.id+'" data-st="'+(x.status==='resolved'?'new':'resolved')+'" onclick="setRep(this.dataset.id,this.dataset.st)">'+(x.status==='resolved'?'&#8634;':'&#10003;')+'</button>'+
      (isAdmin()?'<button class="btn-ghost" title="Delete report" data-id="'+x.id+'" onclick="delRep(this.dataset.id)">&#128465;</button>':'')+'</div></div>'}).join('');
}
function setRep(id,st){api('PUT','/api/admin/reports?id='+id,{status:st}).then(function(r){if(!r.ok)throw r.status;toast(st==='resolved'?'✅ Marked resolved':'Reopened');loadReps();repCount()}).catch(function(){toast('⚠️ Couldn’t update')})}
function delRep(id){if(!confirm('Delete this report? This can’t be undone.'))return;api('DELETE','/api/admin/reports?id='+id).then(function(r){if(!r.ok)throw r.status;toast('Deleted');loadReps();repCount()}).catch(function(e){toast(e===403?'⚠️ Admin only':'⚠️ Couldn’t delete')})}

var SUBS=[];
function vSubs(){
  $('view').innerHTML=head('Subscribers')+'<div class="card"><p class="empty"><span class="spin"></span> Loading…</p></div>';
  if(!apiOk){$('view').innerHTML=head('Subscribers')+'<div class="card"><p class="empty">API not connected.</p></div>';return;}
  api('GET','/api/admin/subscribers').then(function(r){return r.json()}).then(function(d){
    SUBS=d.subscribers||[];
    var h=head('Subscribers',SUBS.length?'<button class="bt bs" onclick="exportSubs()">&#11015; Export CSV</button>':'');
    h+='<div class="grid stats" style="margin-bottom:14px"><div class="stat"><div class="n" id="subN">'+SUBS.length+'</div><div class="l red">Total subscribers</div></div></div>';
    if(SUBS.length)h+='<div class="fl"><input id="subQ" placeholder="Search by email" oninput="renderSubs()"></div>';
    h+='<div class="list" id="subList"></div>';$('view').innerHTML=h;renderSubs();
  }).catch(function(){$('view').innerHTML=head('Subscribers')+'<div class="card"><p class="empty">Couldn’t load (admin only, or offline).</p></div>'});
}
function renderSubs(){var el=$('subList');if(!el)return;var q=($('subQ')?$('subQ').value:'').trim().toLowerCase();
  var L=SUBS.filter(function(x){return !q||String(x.email||x).toLowerCase().indexOf(q)>=0});
  if(!SUBS.length){el.innerHTML='<p class="empty">No subscribers yet.</p>';return;}
  if(!L.length){el.innerHTML='<p class="empty">No match.</p>';return;}
  el.innerHTML=L.map(function(x){var em=x.email||x;return '<div class="row"><div class="meta"><div class="ti" style="font-weight:600;cursor:default">'+esc(em)+'</div>'+(x.subscribed_at?'<div class="su">Joined '+esc((x.subscribed_at||'').split(' ')[0])+'</div>':'')+'</div>'+
    '<div class="acts"><button class="btn-ghost" title="Remove from the newsletter" data-email="'+esc(em)+'" onclick="removeSub(this.dataset.email)">&#128465;</button></div></div>'}).join('');
}
// Remove on the server first; the row goes only once the server agrees.
function removeSub(em){if(!confirm('Remove '+em+' from the newsletter? They stop getting the monthly email.'))return;
  api('DELETE','/api/admin/subscribers?email='+encodeURIComponent(em)).then(function(r){
    if(r.ok){SUBS=SUBS.filter(function(x){return (x.email||x)!==em});if($('subN'))$('subN').textContent=SUBS.length;renderSubs();toast('Removed '+em);}
    else toast(r.status===401||r.status===403?'⚠️ Admin only':'⚠️ Couldn’t remove (the live site may need the latest backend)');
  }).catch(function(){toast('⚠️ Network error')});
}
function exportSubs(){
  var rows=[['email','subscribed_at']].concat(SUBS.map(function(x){return [x.email||x,x.subscribed_at||'']}));
  var csv=rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='utah-view-subscribers-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();
}

check();
</script>
</body>
</html>
