<style>
:root {

  --gray-900: #1a1a1a; --gray-700: #333; --gray-500: #666; --gray-400: #888;
  --gray-300: #aaa; --gray-200: #d4d4d4; --gray-100: #eee; --gray-50: #f7f7f7; --white: #fff;

}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--serif); color:var(--black); background:var(--white); -webkit-font-smoothing:antialiased; line-height:1.6; }
.container { max-width:1200px; margin:0 auto; padding:0 20px; }
.rule { border:none; border-top:1px solid var(--gray-200); }

.top-bar { padding:8px 0; border-bottom:1px solid var(--gray-200); font-family:var(--sans); font-size:12px; color:var(--gray-500); display:flex; justify-content:space-between; align-items:center; }

.g-btn { display:inline-flex; align-items:center; gap:8px; padding:5px 14px; font-family:var(--sans); font-size:12px; font-weight:600; color:var(--gray-700); background:var(--white); border:1px solid var(--gray-200); border-radius:3px; cursor:pointer; transition:all 0.2s; }

.user-pill.active { display:inline-flex; }
.user-avatar { width:26px; height:26px; border-radius:50%; background:var(--red); color:var(--white); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
.user-name { font-weight:600; color:var(--gray-700); }
.user-drop { display:none; position:absolute; top:calc(100% + 8px); right:0; background:var(--white); border:1px solid var(--gray-200); box-shadow:0 4px 16px rgba(0,0,0,0.1); min-width:200px; z-index:200; }
.user-drop.open { display:block; }

.main-nav { border-top:2px solid var(--black); border-bottom:1px solid var(--gray-200); padding:10px 0; display:flex; justify-content:center; gap:28px; flex-wrap:wrap; }

.ticker-bar { background:var(--red); color:var(--white); padding:10px 0; margin:28px 0 0; overflow:hidden; }
.ticker-inner { display:flex; align-items:center; gap:16px; }

.ticker-text { font-family:var(--sans); font-size:14px; font-weight:500; white-space:nowrap; animation:ticker-scroll 30s linear infinite; }
@keyframes ticker-scroll { 0%{transform:translateX(80vw)} 100%{transform:translateX(-200%)} }

  .hero-right { border-bottom:none; }

  .editorial-main { padding-right:0; border-right:none; margin-bottom:20px; }

<script>
var API = 'https://api.theutahview.com';
var GCID = '562818410025-d6n1627aucueem1npk03mg5n7gs8i5t7.apps.googleusercontent.com';
function getUser() { try { return JSON.parse(localStorage.getItem('utv_user')); } catch(e) { return null; } }
function getToken() { return localStorage.getItem('utv_token') || ''; }
function signIn() {
  google.accounts.id.initialize({ client_id: GCID, callback: function(r) {
    localStorage.setItem('utv_token', r.credential);
    var p = JSON.parse(atob(r.credential.split('.')[1]));
    var u = { email: p.email.toLowerCase(), name: p.name, initial: p.name.charAt(0).toUpperCase() };
    localStorage.setItem('utv_user', JSON.stringify(u));
    fetch(API+'/api/me',{headers:{'Authorization':'Bearer '+r.credential}}).then(function(x){return x.json()}).then(function(d){if(d.role){u.role=d.role;localStorage.setItem('utv_user',JSON.stringify(u))}updateAuth()}).catch(function(){updateAuth()});
    toast('Signed in as '+p.email);
  }});
  google.accounts.id.prompt();
}
function signOut() { localStorage.removeItem('utv_user'); localStorage.removeItem('utv_token'); updateAuth(); toast('Signed out'); }
function toggleDrop() { event.stopPropagation(); document.getElementById('uDrop').classList.toggle('open'); }
function updateAuth() {
  var u = getUser();
  document.getElementById('signInBtn').style.display = u ? 'none' : 'inline-flex';
  var pill = document.getElementById('userPill');
  if (u) { pill.classList.add('active'); document.getElementById('uAvatar').textContent=u.initial; document.getElementById('uName').textContent=u.name; document.getElementById('uEmail').textContent=u.email; document.getElementById('editorLink').style.display=(u.role==='admin'||u.role==='editor')?'block':'none'; }
  else { pill.classList.remove('active'); }
}
document.addEventListener('click',function(e){if(!e.target.closest('.user-pill')){var d=document.getElementById('uDrop');if(d)d.classList.remove('open')}});
function handleSubscribe(e) {
  e.preventDefault(); var em=document.getElementById('subEmail').value.trim(); if(!em) return false;
  fetch(API+'/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})}).then(function(r){return r.json()}).then(function(d){document.getElementById('subSuccess').textContent=d.message==='Already subscribed'?"You're already subscribed!":'Welcome aboard. Your first briefing arrives next month.';document.getElementById('subSuccess').classList.add('show')}).catch(function(){document.getElementById('subSuccess').textContent='Welcome aboard. Your first briefing arrives next month.';document.getElementById('subSuccess').classList.add('show')});
  document.getElementById('subEmail').value=''; return false;
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
document.getElementById('todayDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
var SC={},LC={},FC={};
function rt(id,s){if(!s)return'';return'<div class="side-hl"><a href="article.html?id='+id+'">'+s.title+'</a></div><p class="side-sum">'+s.summary+'</p><p class="side-by">By <span>'+s.author+'</span>'+(s.read_time||s.readTime?' · '+(s.read_time||s.readTime)+' read':'')+'</p>'}
function renderHome(){
  var L=LC,S=SC,tk=document.getElementById('tickerText');if(tk)tk.textContent=L.ticker||'';var h='';
  var lead=S[L.hero_lead],sec=S[L.hero_secondary],ctr=S[L.hero_center];
  h+='<div class="container"><div class="hero-section"><hr class="rule-thick"><div style="height:18px"></div><div class="hero-grid"><div class="hero-left"><p class="section-tag">Lead Analysis</p>';
  if(lead){h+='<h1 class="hero-headline"><a href="article.html?id='+L.hero_lead+'">'+lead.title+'</a></h1><p class="hero-summary">'+lead.summary+'</p><p class="hero-byline">By <span>'+lead.author+'</span>'+(lead.read_time?' · '+lead.read_time+' read':'')+'</p>'}
  if(sec){h+='<hr class="rule" style="margin-bottom:18px">'+rt(L.hero_secondary,sec)}
  h+='</div><div class="hero-center">';
  if(L.hero_image){h+='<img class="hero-img-real" src="'+L.hero_image+'" alt="">'}else{h+='<div class="hero-img"></div>'}
  if(L.hero_center_caption)h+='<p class="hero-caption">'+L.hero_center_caption+'</p>';if(ctr)h+=rt(L.hero_center,ctr);
  h+='</div><div class="hero-right"><p class="section-tag-gray">From This Issue</p>';
  if(L.hero_right){L.hero_right.forEach(function(id,i){if(i>0)h+='<hr class="rule" style="margin:14px 0">';h+=rt(id,S[id])})}
  h+='</div></div></div></div>';
  // EDITORIAL
  var ed=L.editorial||[];
  if(ed.length){
    h+='<div class="container"><div class="editorial-section"><hr class="rule-thick"><div style="height:18px"></div><div class="editorial-grid"><div class="editorial-main"><div class="editorial-tag">Editorial & Opinion</div>';
    var edMain=S[ed[0]];
    if(edMain){h+='<div class="editorial-hl"><a href="article.html?id='+ed[0]+'">'+edMain.title+'</a></div><p class="editorial-sum">'+edMain.summary+'</p><p class="editorial-by">By <span>'+edMain.author+'</span>'+(edMain.read_time||edMain.readTime?' · '+(edMain.read_time||edMain.readTime)+' read':'')+'</p>'}
    h+='</div><div class="editorial-side"><div class="editorial-tag">More Opinion</div>';
    for(var ei=1;ei<ed.length;ei++){var es=S[ed[ei]];if(es){h+='<div class="editorial-item"><div class="side-hl"><a href="article.html?id='+ed[ei]+'">'+es.title+'</a></div><p class="side-sum">'+es.summary+'</p><p class="side-by">By <span>'+es.author+'</span></p></div>'}}
    h+='</div></div></div></div>';
  }
  var rg=L.regions||{},ro=['The Americas','Europe','Asia-Pacific','Middle East','Africa'];
  h+='<div class="container"><div class="regions-section"><hr class="rule-thick"><div style="height:18px"></div><div class="regions-grid">';
  ro.forEach(function(r){var sid=rg[r],s=S[sid];h+='<div class="region-col"><div class="region-name">'+r+'</div>';if(s){h+='<div class="region-hl"><a href="article.html?id='+sid+'">'+s.title+'</a></div><p class="region-desc">'+s.summary+'</p>'}h+='</div>'});
  h+='</div></div></div>';
  var ft=L.featured||[],ul=L.sidebar_utah||[],db=L.sidebar_data||[];
  h+='<div class="container"><div class="latest-section"><hr class="rule-thick"><div class="latest-header"><span class="latest-title">In This Issue</span><a class="latest-link" href="?view=archive">View full issue →</a></div><div class="latest-grid"><div class="latest-main">';
  ft.forEach(function(id,i){var s=S[id];if(!s)return;h+='<div class="l-article"><span class="l-num">'+String(i+1).padStart(2,'0')+'</span><div><h3 class="l-hl"><a href="article.html?id='+id+'">'+s.title+'</a></h3><p class="l-desc">'+s.summary+'</p><p class="l-meta">By <span>'+s.author+'</span> · '+(s.region||'Analysis')+'</p></div></div>'});
  h+='</div><div class="latest-sidebar">';
  if(ul.length){h+='<div class="sb-block"><div class="sb-title">The Utah Lens</div>';ul.forEach(function(id){var s=S[id];if(s)h+='<div class="sb-item"><h4 class="sb-hl"><a href="article.html?id='+id+'">'+s.title+'</a></h4><p class="sb-desc">'+s.summary+'</p></div>'});h+='</div>'}
  if(db.length){h+='<div class="sb-block"><div class="sb-title">Data Brief</div>';db.forEach(function(id){var s=S[id];if(s)h+='<div class="sb-item"><h4 class="sb-hl"><a href="article.html?id='+id+'">'+s.title+'</a></h4><p class="sb-desc">'+s.summary+'</p></div>'});h+='</div>'}
  h+='</div></div></div></div>';
  document.getElementById('dynamicContent').innerHTML=h;
}
function renderFoot(){
  var ss=FC;var h='<div class="sub-banner" id="subscribe-section"><div class="container"><p class="sub-overline">'+(ss.sub_overline||'Stay briefed')+'</p><h2 class="sub-heading">'+(ss.sub_heading||'Independent analysis, delivered monthly')+'</h2><p class="sub-desc">'+(ss.sub_desc||'The Utah View covers every region, every month — with the depth of a journal and the clarity of a briefing.')+'</p><form class="sub-form" onsubmit="return handleSubscribe(event)"><input type="email" class="sub-input" id="subEmail" placeholder="your@email.com" required><button type="submit" class="sub-btn">Subscribe</button></form><p class="sub-success" id="subSuccess"></p></div></div>';
  h+='<div class="container"><div class="footer"><div class="footer-grid">';
  var cols=ss.footer_cols||[{title:'Regions',links:[{text:'The Americas',url:'?cat=The Americas'},{text:'Europe',url:'?cat=Europe'},{text:'Asia-Pacific',url:'?cat=Asia-Pacific'},{text:'Middle East',url:'?cat=Middle East'},{text:'Africa',url:'?cat=Africa'}]},{title:'Sections',links:[{text:'Lead Analysis',url:'?cat=Analysis'},{text:'Opinion',url:'?cat=Opinion'},{text:'Data Briefs',url:'?cat=Data'}]},{title:'About',links:[{text:'Our Mission',url:'page.html?p=our-mission'},{text:'Methodology',url:'article.html?id=methodology'},{text:'Editorial Team',url:'page.html?p=editorial-team'},{text:'Contact',url:'page.html?p=contact'}]},{title:'Follow',links:[{text:'Newsletter',url:'#subscribe-section'}]}];
  cols.forEach(function(c){h+='<div class="footer-col"><div class="footer-col-title">'+c.title+'</div>';(c.links||[]).forEach(function(l){h+='<a href="'+(l.url||'')+'">'+l.text+'</a>'});h+='</div>'});
  h+='</div><div class="footer-bottom"><span class="footer-copyright">'+(ss.copyright||'© 2026 The Utah View. All rights reserved. Salt Lake City, Utah.')+'</span><div class="footer-logo-sm"><svg width="20" height="20" viewBox="0 0 100 100" fill="none"><path d="M4 4 H40 V16 H16 V52 H4 Z" fill="#C4352A"/><path d="M20 20 H56 V32 H32 V68 H20 Z" fill="#C4352A"/><rect x="40" y="40" width="56" height="56" fill="#C4352A"/><rect x="48" y="48" width="40" height="40" fill="white"/><text x="68" y="76" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="24" font-weight="700" fill="#C4352A">UT</text></svg><span class="footer-logo-text">The Utah View</span></div></div></div></div>';
  document.getElementById('subscribeFooter').innerHTML=h;
  var abl=document.getElementById('aboutLink');if(abl&&ss.about_url)abl.href=ss.about_url;if(abl&&ss.about_text)abl.textContent=ss.about_text;
}
function renderList(stories,title,empty){
  document.querySelector('.ticker-bar').style.display='none';
  var h='<div class="container"><div class="cat-page"><a class="cat-back" href="index.html">← Home</a><h1 class="cat-title">'+title+'</h1><p class="cat-count">'+stories.length+' article'+(stories.length!==1?'s':'')+'</p>';
  if(!stories.length)h+='<p style="color:var(--gray-400);font-size:15px">'+(empty||'No stories found.')+'</p>';
  stories.forEach(function(item){var id=item.id||item[0],s=item.id?item:item[1];var ds=s.date?new Date(s.date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'';h+='<div class="cat-story"><div class="cat-region-tag">'+(s.region||'')+'</div><h2 class="cat-story-hl"><a href="article.html?id='+id+'">'+s.title+'</a></h2><p class="cat-story-sum">'+s.summary+'</p><p class="cat-story-meta">By <span>'+s.author+'</span>'+(ds?' · '+ds:'')+'</p></div>'});
  h+='</div></div>';document.getElementById('dynamicContent').innerHTML=h;
}
updateAuth();
var up=new URLSearchParams(window.location.search),cat=up.get('cat'),vs=up.get('view')==='saved',va=up.get('view')==='archive';
function go(){
  var p1=fetch(API+'/api/stories').then(function(r){return r.json()}).then(function(d){(d.stories||[]).forEach(function(s){SC[s.id]=s})}).catch(function(){try{SC=JSON.parse(localStorage.getItem('utv_stories'))||{}}catch(e){}});
  var p2=fetch(API+'/api/config/layout').then(function(r){return r.json()}).then(function(d){LC=d.value||{}}).catch(function(){try{LC=JSON.parse(localStorage.getItem('utv_layout'))||{}}catch(e){}});
  var p3=fetch(API+'/api/config/site').then(function(r){return r.json()}).then(function(d){FC=d.value||{}}).catch(function(){try{FC=JSON.parse(localStorage.getItem('utv_site'))||{}}catch(e){}});
  Promise.all([p1,p2,p3]).then(function(){
    renderFoot();
    if(va){var a=Object.entries(SC).sort(function(a,b){return(b[1].date||'').localeCompare(a[1].date||'')});renderList(a,'Archive','No published articles yet.')}
    else if(vs){var si=[];try{si=JSON.parse(localStorage.getItem('utv_saved'))||[]}catch(e){}var sv=si.map(function(id){return SC[id]?[id,SC[id]]:null}).filter(Boolean);renderList(sv,'Saved Stories','No saved stories yet. Click <strong>Save</strong> on any article to bookmark it.')}
    else if(cat){document.querySelectorAll('#mainNav a').forEach(function(a){if(a.textContent===cat)a.classList.add('active')});var m=Object.entries(SC).filter(function(e){var s=e[1];if(cat==='Analysis'||cat==='Opinion'||cat==='Data')return s.region===cat||s.region==='Global'||s.region==='The Utah Lens';return s.region===cat});renderList(m,cat,'No stories in this category yet.')}
    else{renderHome()}
  });
}
go();
</script>
