name: utah_view
description: "The Utah View — a monthly global politics publication. Native reader app for iOS and Android."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  cached_network_image: ^4.0.4
  flutter_widget_from_html_core: ^0.17.4
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  collection: ^1.19.1
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  # analyzer 14.5.0 removed a setter that build_runner 2.16.1 still uses.
  # Drop this pin once build_runner ships a compatible release.
  analyzer: '>=14.0.0 <14.5.0'
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/licenses/

  fonts:
    # Source Serif 4 (text optical size) for article body and summaries.
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSerif4-BoldItalic.ttf
          weight: 700
          style: italic
    # Source Serif 4 cut at the display optical size for headlines.
    - family: SourceSerif4Display
      fonts:
        - asset: assets/fonts/SourceSerif4Display-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4Display-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSerif4Display-BoldItalic.ttf
          weight: 700
          style: italic
    # Inter for UI chrome: labels, bylines, buttons, navigation.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# App icon, generated from the logo painter by
# tool/brand_assets/generate_brand_assets_test.dart.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  adaptive_icon_monochrome: assets/brand/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#C4352A"

# White launch screen with the logo.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash_logo_android12.png
    icon_background_color: "#FFFFFF"
  web: false
