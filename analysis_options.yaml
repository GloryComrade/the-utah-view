include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # freezed places @JsonKey/@JsonSerializable on factory constructor parameters.
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
